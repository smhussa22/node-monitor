! FRR router 1 — AS 65001
! peers with frr-router-2 at 172.20.0.11 (AS 65002) via eBGP. real TCP/179 control plane, real
! OPEN / UPDATE / KEEPALIVE messages. the bgp4-mib gets exposed via the snmp module loaded in daemons
!
hostname frr1
log stdout
!
router bgp 65001
 bgp router-id 172.20.0.10
 no bgp ebgp-requires-policy
 neighbor 172.20.0.11 remote-as 65002
 neighbor 172.20.0.11 description peer-frr2
 !
 address-family ipv4 unicast
  network 10.10.10.0/24
  neighbor 172.20.0.11 activate
  neighbor 172.20.0.11 soft-reconfiguration inbound
 exit-address-family
!
ip route 10.10.10.0/24 Null0
!
line vty
!
