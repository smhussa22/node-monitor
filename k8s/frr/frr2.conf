! FRR router 2 — AS 65002
! peers with frr-router-1 at 172.20.0.10 (AS 65001) via eBGP
!
hostname frr2
log stdout
!
router bgp 65002
 bgp router-id 172.20.0.11
 no bgp ebgp-requires-policy
 neighbor 172.20.0.10 remote-as 65001
 neighbor 172.20.0.10 description peer-frr1
 !
 address-family ipv4 unicast
  network 10.20.20.0/24
  neighbor 172.20.0.10 activate
  neighbor 172.20.0.10 soft-reconfiguration inbound
 exit-address-family
!
ip route 10.20.20.0/24 Null0
!
line vty
!
