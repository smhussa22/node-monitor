# single Service exposes both the http metrics endpoint and the udp netflow endpoint
apiVersion: v1
kind: Service
metadata:
  name: collector
  labels:
    app: collector
spec:
  type: ClusterIP
  selector:
    app: collector
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: netflow
      port: 2055
      targetPort: 2055
      protocol: UDP
    - name: dhcp
      port: 67
      targetPort: 67
      protocol: UDP
    - name: dns
      port: 53
      targetPort: 53
      protocol: UDP
    - name: snmp-trap
      port: 162
      targetPort: 162
      protocol: UDP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  labels:
    app: collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      terminationGracePeriodSeconds: 15
      serviceAccountName: collector
      containers:
        - name: collector
          image: node-monitor-collector:latest
          imagePullPolicy: IfNotPresent
          # NET_BIND_SERVICE lets the dhcp server bind UDP/67 without running the whole container as root.
          # without this capability, port < 1024 is privileged and the bind would fail
          securityContext:
            capabilities:
              add: ["NET_BIND_SERVICE"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: netflow
              containerPort: 2055
              protocol: UDP
            - name: dhcp
              containerPort: 67
              protocol: UDP
            - name: dns
              containerPort: 53
              protocol: UDP
            - name: snmp-trap
              containerPort: 162
              protocol: UDP
          # placeholders so a future Phase 3 MetricStore can pick the dsn up; safe to ignore for now
          env:
            - name: POSTGRES_HOST
              value: "postgres"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            # snmp poller targets: one simulator pod per vendor exposes a primary device on UDP/161,
            # reachable via its service name on the cluster network. comma-separated host[:port] entries
            - name: SNMP_TARGETS
              value: "simulator-cisco,simulator-juniper,simulator-paloalto"
            - name: SNMP_COMMUNITY
              value: "public"
          resources:
            requests:
              cpu: "200m"
              memory: "128Mi"
            limits:
              cpu: "1500m"
              memory: "512Mi"
---
# HPA scales collector replicas 1..5 when sustained CPU > 70%
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: collector
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: collector
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
