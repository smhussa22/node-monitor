# headless Service so the collector's snmp poller can resolve "simulator-juniper" and reach UDP/161
apiVersion: v1
kind: Service
metadata:
  name: simulator-juniper
  labels:
    app: simulator
    vendor: juniper
spec:
  type: ClusterIP
  selector:
    app: simulator
    vendor: juniper
  ports:
    - name: snmp
      port: 161
      targetPort: 161
      protocol: UDP
---
# 5 pods x 20 simulated firewalls each = 100 juniper srx devices
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator-juniper
  labels:
    app: simulator
    vendor: juniper
spec:
  replicas: 5
  selector:
    matchLabels:
      app: simulator
      vendor: juniper
  template:
    metadata:
      labels:
        app: simulator
        vendor: juniper
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: simulator
          image: node-monitor-simulator:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add: ["NET_BIND_SERVICE"]
          ports:
            - name: snmp
              containerPort: 161
              protocol: UDP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DHCP_SERVER
              value: "collector"
            - name: DNS_SERVER
              value: "collector"
            - name: SNMP_TRAP_TARGET
              value: "collector:162"
            - name: SNMP_TRAP_INTERVAL
              value: "30"
          args:
            - "--vendor=juniper"
            - "--count=20"
            - "--interval=30"
            - "--duration=0"
            - "--collector=http://collector:8000"
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "300m"
              memory: "192Mi"
