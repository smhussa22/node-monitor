# headless Service so the collector's snmp poller can resolve "simulator-paloalto" and reach UDP/161
apiVersion: v1
kind: Service
metadata:
  name: simulator-paloalto
  labels:
    app: simulator
    vendor: paloalto
spec:
  type: ClusterIP
  selector:
    app: simulator
    vendor: paloalto
  ports:
    - name: snmp
      port: 161
      targetPort: 161
      protocol: UDP
---
# 2 pods x 50 simulated firewalls each = 100 palo alto devices
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator-paloalto
  labels:
    app: simulator
    vendor: paloalto
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simulator
      vendor: paloalto
  template:
    metadata:
      labels:
        app: simulator
        vendor: paloalto
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: simulator
          image: node-monitor-simulator:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add: ["NET_BIND_SERVICE"]
          ports:
            - name: snmp
              containerPort: 161
              protocol: UDP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DHCP_SERVER
              value: "collector"
            - name: DNS_SERVER
              value: "collector"
          args:
            - "--vendor=paloalto"
            - "--count=50"
            - "--interval=30"
            - "--duration=0"
            - "--collector=http://collector:8000"
          resources:
            requests:
              cpu: "75m"
              memory: "112Mi"
            limits:
              cpu: "400m"
              memory: "224Mi"
