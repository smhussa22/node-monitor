# local dev / interactive test rig
# brings up postgres + collector + one simulator pod per vendor on a shared network
# usage:
#   docker compose up -d           # start everything in the background
#   docker compose logs -f collector
#   docker compose down -v         # tear down and wipe the postgres volume

services:

  postgres:
    image: postgres:16
    container_name: nm-postgres
    environment:
      POSTGRES_USER: nodemonitor
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: node_monitor
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodemonitor -d node_monitor"]
      interval: 2s
      timeout: 2s
      retries: 30

  collector:
    image: node-monitor-collector:latest
    container_name: nm-collector
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: nodemonitor
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: node_monitor
      # snmp poller: one agent per simulator container is reachable at the docker service name. the
      # poller queries baseline OIDs (sysName, sysUpTime, enterprise cpu / memory) every 30s
      SNMP_TARGETS: "simulator-cisco,simulator-juniper,simulator-paloalto"
      SNMP_COMMUNITY: "public"
    ports:
      - "8000:8000"
      - "2055:2055/udp"

  dashboard:
    image: node-monitor-dashboard:latest
    container_name: nm-dashboard
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: nodemonitor
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: node_monitor
    ports:
      - "5000:5000"

  simulator-cisco:
    image: node-monitor-simulator:latest
    depends_on:
      - collector
    environment:
      DHCP_SERVER: "collector"
      DNS_SERVER: "collector"
      SNMP_TRAP_TARGET: "collector:162"
      SNMP_TRAP_INTERVAL: "30"
    command:
      - "--vendor=cisco"
      - "--count=20"
      - "--interval=5"
      - "--duration=0"
      - "--collector=http://collector:8000"
      - "--netflow-host=collector"
      - "--netflow-port=2055"
      - "--hostname-prefix=ciscopod"

  simulator-juniper:
    image: node-monitor-simulator:latest
    depends_on:
      - collector
    environment:
      DHCP_SERVER: "collector"
      DNS_SERVER: "collector"
      SNMP_TRAP_TARGET: "collector:162"
      SNMP_TRAP_INTERVAL: "30"
    command:
      - "--vendor=juniper"
      - "--count=10"
      - "--interval=5"
      - "--duration=0"
      - "--collector=http://collector:8000"
      - "--hostname-prefix=junpod"

  simulator-paloalto:
    image: node-monitor-simulator:latest
    depends_on:
      - collector
    environment:
      DHCP_SERVER: "collector"
      DNS_SERVER: "collector"
      SNMP_TRAP_TARGET: "collector:162"
      SNMP_TRAP_INTERVAL: "30"
    command:
      - "--vendor=paloalto"
      - "--count=10"
      - "--interval=5"
      - "--duration=0"
      - "--collector=http://collector:8000"
      - "--hostname-prefix=papod"

  # two real FRR routing daemons that peer with each other over eBGP. demonstrates the boundary the
  # writeup commits to: we don't reimplement BGP / OSPF / EVPN — we observe a real implementation
  # via the same SNMP poller that handles everything else. AS 65001 <-> AS 65002 over TCP/179.
  # static IPs on a dedicated network so the configs can hardcode neighbor addresses
  frr-router-1:
    build:
      context: k8s/frr
    container_name: nm-frr1
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    environment:
      FRR_HOSTNAME: "frr1"
      COLLECTOR_URL: "http://collector:8000/"
      BGP_SCRAPE_INTERVAL: "15"
    volumes:
      - ./k8s/frr/frr1.conf:/etc/frr/frr.conf:ro
    networks:
      frrnet:
        ipv4_address: 172.20.0.10
      default: {}

  frr-router-2:
    build:
      context: k8s/frr
    container_name: nm-frr2
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    environment:
      FRR_HOSTNAME: "frr2"
      COLLECTOR_URL: "http://collector:8000/"
      BGP_SCRAPE_INTERVAL: "15"
    volumes:
      - ./k8s/frr/frr2.conf:/etc/frr/frr.conf:ro
    networks:
      frrnet:
        ipv4_address: 172.20.0.11
      default: {}

volumes:
  pg-data:

networks:
  default:
    name: node-monitor_default
  # private subnet that frr-router-1 and frr-router-2 share for the eBGP peering. neighbor addresses
  # in frr1.conf / frr2.conf are 172.20.0.10 and 172.20.0.11 — pinned via the ipam config below
  frrnet:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/24
