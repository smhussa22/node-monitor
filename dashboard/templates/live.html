{% extends "base.html" %}
{% block title %}live · node-monitor{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">live event stream</h3>
    <span class="badge bg-success" id="live-status">connecting…</span>
</div>

<div class="card">
    <div class="card-header d-flex justify-content-between fw-semibold">
        <span>incoming metrics (newest first)</span>
        <span><span id="live-count">0</span> events</span>
    </div>
    <div class="table-responsive" style="max-height: 70vh; overflow-y: auto;">
        <table class="table table-sm table-hover mb-0">
            <thead class="position-sticky top-0 bg-body">
                <tr><th>ts</th><th>host</th><th>vendor</th><th>cpu</th><th>memory</th><th>health</th></tr>
            </thead>
            <tbody id="live-feed">
            </tbody>
        </table>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
    startLiveStream();
</script>
{% endblock %}
