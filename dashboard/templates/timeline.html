{% extends "base.html" %}
{% block title %}timeline · node-monitor{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">incident timeline</h3>
    <span class="badge bg-secondary">{{ count }} incidents in last {{ current_window }}</span>
</div>

<div class="card">
    <div class="card-body">
        <div id="timeline" style="min-height: 500px;"></div>
        {% if count == 0 %}
            <div class="text-secondary text-center py-5">no incidents to render in this window</div>
        {% endif %}
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
    const incidents = {{ incidents_json | safe }};
    renderIncidentTimeline(incidents);
</script>
{% endblock %}
