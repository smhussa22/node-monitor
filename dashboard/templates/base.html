<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}node-monitor{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">node-monitor</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" href="/">overview</a>
            <a class="nav-link" href="/topology">topology</a>
            <a class="nav-link" href="/devices">devices</a>
            <a class="nav-link" href="/alerts">alerts</a>
            <a class="nav-link" href="/actions">actions</a>
            <a class="nav-link" href="/timeline">timeline</a>
            <a class="nav-link" href="/netflow">netflow</a>
            <a class="nav-link" href="/blocked-traffic">blocked</a>
            <a class="nav-link" href="/live">live</a>
        </div>
        <div class="d-flex align-items-center gap-2">
            <span class="text-secondary small">window</span>
            <div class="btn-group btn-group-sm" role="group">
                {% for w in windows %}
                    <a class="btn btn-outline-light {% if current_window == w %}active{% endif %}"
                       href="/set-window/{{ w }}?next={{ request.path }}">{{ w }}</a>
                {% endfor %}
            </div>
        </div>
    </div>
</nav>

<main class="container-fluid py-4">
    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vis-timeline@7.7.3/standalone/umd/vis-timeline-graph2d.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/vis-timeline@7.7.3/styles/vis-timeline-graph2d.min.css" rel="stylesheet">
<script src="{{ url_for('static', filename='dashboard.js') }}"></script>
{% block scripts %}{% endblock %}

</body>
</html>
